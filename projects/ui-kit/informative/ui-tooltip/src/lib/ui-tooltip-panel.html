<div [class]="classes()" role="tooltip" [id]="tooltipId()">
  <span class="ui-tooltip-arrow" aria-hidden="true"></span>
  <div class="ui-tooltip-text">
    @if (template()) {
      <ng-container *ngTemplateOutlet="template()!; context: templateContext()" />
    } @else if (escape()) {
      {{ text() }}
    } @else {
      <!-- eslint-disable-next-line no-restricted-syntax -- EXCEPTION JUSTIFIÉE : mode `escape=false` (opt-in). Ce n'est PAS un contournement — la liaison passe par l'assainisseur d'Angular, aucun bypass n'est levé. Registre : docs/SECURITY-PRACTICES.md. -->
      <span [innerHTML]="text()"></span>
    }
  </div>
</div>
