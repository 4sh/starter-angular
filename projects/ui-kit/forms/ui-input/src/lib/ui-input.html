<ui-field
  [label]="label()"
  [for]="resolvedId()"
  [required]="required()"
  [size]="size()"
  [level]="effectiveLevel()"
  [floatLabel]="floatLabel()"
  [filled]="isFilled()"
  [hasPrefix]="!!iconLeft() || !!resolvedIconLeftTemplate()"
  [disabled]="isDisabled()"
  [readonly]="readonly()"
  [message]="displayMessage()"
  [messageId]="messageId()"
>
  @if (resolvedIconLeftTemplate(); as tpl) {
    <span uiFieldPrefix class="ui-input-icon" [class._disabled]="isDisabled()">
      <ng-container [ngTemplateOutlet]="tpl" [ngTemplateOutletContext]="leftIconContext()" />
    </span>
  } @else if (iconLeft(); as name) {
    <ui-icon
      uiFieldPrefix
      class="ui-input-icon"
      [class._disabled]="isDisabled()"
      [name]="name"
      [size]="iconSize()"
    />
  }

  <input
    #inputEl
    class="ui-input-native"
    [class._small]="size() === 'small'"
    [type]="type()"
    [id]="resolvedId()"
    [value]="renderedValue()"
    [placeholder]="effectivePlaceholder()"
    [disabled]="isDisabled()"
    [readOnly]="readonly()"
    [required]="required()"
    [attr.name]="name() || null"
    [attr.tabindex]="tabindex()"
    [attr.autocomplete]="autocomplete() || null"
    [attr.maxlength]="maxlength()"
    [attr.aria-haspopup]="ariaHasPopup() || null"
    [attr.aria-expanded]="ariaExpanded() ?? null"
    [attr.aria-controls]="ariaControls() || null"
    [attr.aria-label]="label() ? null : ariaLabel() || null"
    [attr.aria-labelledby]="ariaLabelledBy() || null"
    [attr.aria-describedby]="resolvedAriaDescribedBy()"
    [attr.aria-invalid]="effectiveLevel() === 'error' ? 'true' : null"
    (input)="onInput()"
    (focus)="inputFocus.emit($event)"
    (blur)="onBlur($event)"
  />

  @if (unit(); as u) {
    <span
      uiFieldSuffix
      class="ui-input-unit"
      [class._small]="size() === 'small'"
      [class._disabled]="isDisabled()"
      >{{ u }}</span
    >
  }

  @if (iconRight() || resolvedIconRightTemplate()) {
    @if (hasRightAction()) {
      <button
        uiFieldSuffix
        type="button"
        class="ui-input-action"
        [attr.aria-label]="iconRightAriaLabel()"
        [disabled]="isDisabled()"
        (click)="iconRightClick.emit($event)"
      >
        @if (resolvedIconRightTemplate(); as tpl) {
          <ng-container [ngTemplateOutlet]="tpl" [ngTemplateOutletContext]="rightIconContext()" />
        } @else {
          <ui-icon [name]="iconRight()!" [size]="iconSize()" />
        }
      </button>
    } @else if (resolvedIconRightTemplate(); as tpl) {
      <span uiFieldSuffix class="ui-input-icon" [class._disabled]="isDisabled()">
        <ng-container [ngTemplateOutlet]="tpl" [ngTemplateOutletContext]="rightIconContext()" />
      </span>
    } @else {
      <ui-icon
        uiFieldSuffix
        class="ui-input-icon"
        [class._disabled]="isDisabled()"
        [name]="iconRight()!"
        [size]="iconSize()"
      />
    }
  }
</ui-field>
