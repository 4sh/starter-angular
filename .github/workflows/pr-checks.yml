name: PR checks

# Runs on every pull request. Until this existed, nothing verified that a PR
# compiled, linted or type-checked before landing on `main` — and `main` is the
# branch `@4sh/ui-kit` is published from, so a regression reaching it can reach
# consumers.
#
# ⚠️ `Lint, types & docs` and `Build Storybook` are required status checks: the
# `main` ruleset matches them by job `name:`, not by job id. Renaming either one
# blocks every PR until the ruleset follows.
on:
  # No `paths-ignore` here, on purpose. A workflow filtered out at trigger level
  # never starts, so it reports no check, and the required ones stay "Expected"
  # forever. A companion workflow on `paths:` would not fix it either: it fires
  # as soon as ONE file matches, so on any PR that also touches CHANGELOG.md
  # (nearly all of them) it posts a second, always-green check under the same
  # name. The docs-only shortcut lives in the `changes` job instead: a job
  # skipped by its `if:` still reports its check, as `skipped`, which passes.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch supersedes the previous run.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # FSHSP-194: nothing below builds, lints, type-checks or renders docs and repo
  # metadata, so a PR that only touches those skips the heavy jobs.
  changes:
    name: Detect docs-only changes
    # A manual run has no PR file list: this job is skipped and everything runs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      # Reads the PR's "Files changed", the list `paths-ignore` used to match.
      # These are shell `case` patterns, where `*` also matches `/`: `*.md` is
      # any Markdown file at any depth (the old `**/*.md`).
      - name: Check whether only docs changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          docs_only=true
          while IFS= read -r file; do
            case "$file" in
              *.md | docs/* | LICENSE | .vscode/* | .github/ISSUE_TEMPLATE/*) ;;
              *) docs_only=false; echo "Full checks needed, first non-doc file: $file"; break ;;
            esac
          done <<< "$files"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  checks:
    name: Lint, types & docs
    needs: changes
    # Skipped only on an explicit `true`. If `changes` failed or was skipped,
    # the output is empty and the job runs: a broken detector must never turn
    # into a green required check. `!cancelled()` is what lets the job run past
    # a failed `needs`, while still stopping it when a newer push cancels.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read Node.js version from .nvmrc
        id: nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      # Avant `setup-node` : c'est la présence de `pnpm` sur le PATH qui permet à
      # setup-node de localiser le store à mettre en cache. La version installée
      # vient du champ `packageManager` du package.json — un seul endroit à bumper.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}
          cache: 'pnpm'

      # `postinstall` chains tokens:build → ui-kit:build → docs:config, so this
      # step already proves the 53 entry points compile. A failing package build
      # fails the install, before any check below runs.
      - name: Install dependencies (builds tokens + package)
        run: pnpm install --frozen-lockfile

      # `pnpm lint` carries --fix: it repairs instead of reporting, so in CI
      # it would never fail. lint:check is the same target without it.
      - name: Lint
        run: pnpm lint:check

      - name: Typecheck the demo app
        run: pnpm exec tsc -p tsconfig.app.json --noEmit

      # FSHSP-93: unit tests on the kit (vitest, via the `test` architect
      # target). Covers both the pure-logic specs (mask engine, option
      # resolver, date helpers, label formatting) and the TestBed component
      # specs (select, autocomplete, input-tags, segment-control, tabs, modal,
      # accordion, base CVA).
      - name: Unit tests
        run: pnpm test

      # The token pipeline had no test at all, which is how an alias
      # between two tokens of the same collection could be unresolvable since the
      # beginning — the starter's own `semantics.json` only ever references
      # `primitives`, so the case was never exercised. These specs run
      # `tokens.build.mjs` on throwaway token sets, so they cover the real
      # execution path without touching the generated files.
      - name: Token pipeline tests
        run: pnpm tokens:test

      # `postinstall` has just regenerated everything `docs:config` produces, so
      # this step looks redundant. It is not — it enforces two things nothing
      # else does:
      #
      #  - The validations `component-vars.build.mjs` performs but does NOT fail
      #    on in generation mode: off-convention `--ui-*` names, hooks with no
      #    `///` (public but invisible in the doc), aliases pointing at a token
      #    that does not exist (imports into Figma as an empty variable), and the
      #    counts quoted in prose in `figma/README.md`. Under `postinstall` those
      #    are printed and ignored; only `--check` turns them into a failure.
      #  - The hand-written component lists, via the `components:check` this
      #    chains — the six places that claim to describe `projects/ui-kit/`.
      - name: Check the docs (lists, conventions, quoted counts)
        run: pnpm docs:config:check

      # The opposite case, which the step above CANNOT catch: two of those
      # generated files are committed — `component-vars.scss` ships in the
      # tarball, `component-vars.json` is imported into Figma. `postinstall` has
      # already overwritten them on disk, so comparing disk to disk always
      # passes. Only git knows whether the commit was stale.
      - name: Fail if a committed generated file was stale
        run: git diff --exit-code -- projects/ui-kit/styles/component-vars.scss figma/component-vars.json

  storybook:
    name: Build Storybook
    needs: changes
    # Same gate as `checks`, and for the same reasons.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    # Separate job so it runs alongside the fast checks instead of delaying
    # them: it is the slowest step by far, and it is the public deliverable.
    steps:
      # fetch-depth 0 : `build-storybook` calls `build-info.mjs` (`git describe
      # --tags`), which needs tags a shallow checkout would not fetch. Same
      # reasoning as `deploy-pages.yml`.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read Node.js version from .nvmrc
        id: nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      # Avant `setup-node` : c'est la présence de `pnpm` sur le PATH qui permet à
      # setup-node de localiser le store à mettre en cache. La version installée
      # vient du champ `packageManager` du package.json — un seul endroit à bumper.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

      # Consumed by the `a11y` job below — avoids rebuilding Storybook twice.
      - name: Upload Storybook build
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 1

  a11y:
    name: Accessibility (informational)
    needs: storybook
    # Explicit, because the implicit `success()` also looks at `changes`, two
    # levels up: on a manual run (where `changes` is skipped) it would skip
    # this job even though Storybook was built.
    if: ${{ !cancelled() && needs.storybook.result == 'success' }}
    runs-on: ubuntu-latest
    # FSHSP-93: the addon (@storybook/addon-a11y) was already configured, just
    # never run outside the browser panel. Wiring it into CI surfaced 122
    # pre-existing violations across 21/54 components — turning this into a
    # blocking check today would break every PR touching one of them,
    # including PRs unrelated to accessibility. Kept informational
    # (`continue-on-error`) until that backlog is cleared — see FSHSP-106.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read Node.js version from .nvmrc
        id: nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      # Avant `setup-node` : c'est la présence de `pnpm` sur le PATH qui permet à
      # setup-node de localiser le store à mettre en cache. La version installée
      # vient du champ `packageManager` du package.json — un seul endroit à bumper.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Storybook build
        uses: actions/download-artifact@v8
        with:
          name: storybook-static
          path: storybook-static

      # FSHSP-194: le téléchargement + l'installation de Chromium (pas le cache
      # pnpm, qui ne couvre que node_modules) représentent une bonne partie du
      # temps de ce job à chaque run. `playwright --version` est dans la clé pour
      # invalider le cache automatiquement à chaque bump de version (dependabot
      # groupe déjà `playwright` avec `storybook`, voir la note ci-dessous).
      - name: Read Playwright's version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright's browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # `playwright` est une devDependency DÉCLARÉE, et doit le rester (FSHSP-177).
      # Sous npm cette étape était un `npx playwright install` : npx va chercher le
      # paquet sur le registre s'il manque, et npm aplatissait de toute façon le
      # binaire transitif dans node_modules/.bin. pnpm ne fait ni l'un ni l'autre —
      # `pnpm exec` ne lance QUE ce qui est déclaré.
      #
      # Ne pas « simplifier » en `pnpm dlx playwright` : dlx tire `latest`, donc les
      # navigateurs installés ne correspondraient plus au `playwright-core` que
      # `@storybook/test-runner` et `axe-playwright` résolvent, et les tests
      # échoueraient sur « Executable doesn't exist » — sans bruit, ce job étant
      # `continue-on-error`. Pour la même raison, `playwright` est groupé avec
      # `storybook` dans dependabot.yml : les trois doivent bouger ensemble.
      #
      # `--with-deps` réinstalle les libs système à chaque run (rapide, non
      # caché) même quand le cache ci-dessus évite le téléchargement du binaire
      # Chromium lui-même.
      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run accessibility checks (axe-core via test-runner)
        run: pnpm test-storybook:ci
