name: Publish @4sh/ui-kit to npm

# Manual trigger only: publishing is irreversible (a name+version can never be
# reused, and `npm unpublish` is limited to 72h), so it never fires on a push.
#
# Two jobs on purpose:
#   verify  — always runs, builds and shows the exact tarball contents. No
#             secret, no approval needed, so it is cheap to run as often as
#             you like.
#   publish — only when dry_run is false, and gated behind the `npm-publish`
#             environment so a human must approve before the job can run.
#   release — tags the published commit and opens the GitHub release, from the
#             CHANGELOG section of that version. Split out of `publish` on
#             purpose: it needs `contents: write`, which has no business sitting
#             in the job that holds the npm publishing right.
#
# Authentication uses npm **Trusted Publishing** (OIDC): there is no token and no
# secret. npm verifies the job's OIDC claims against the repository + workflow
# declared on the package settings page, then issues a short-lived publish right
# valid for this job only. The environment gate stays essential: OIDC proves
# *where* the publish comes from, never *who* decided it.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (inspect the tarball without publishing)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Build & inspect tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Node.js version from .nvmrc
        id: nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}
          cache: "npm"

      # Before anything expensive, and above all before the irreversible publish:
      # the release notes are the CHANGELOG section of this version, so a missing
      # section must surface here — during the dry run — and not once the version
      # is already on the registry.
      - name: Check the CHANGELOG documents this version
        run: |
          version=$(node -p "require('./projects/ui-kit/package.json').version")
          echo "Release notes for $version:"
          node scripts/changelog.section.mjs "$version"

      - name: Install dependencies
        run: npm ci

      - name: Build the package
        run: npm run ui-kit:build

      - name: Show what would be published
        run: npm publish --dry-run
        working-directory: dist/ui-kit

  publish:
    name: Publish to npm
    needs: verify
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.published.outputs.version }}
    # Requires a human approval before this job starts — configure
    # *Settings → Environments → npm-publish → Required reviewers*.
    # ⚠️ Referencing an environment that does not exist yet creates it WITHOUT
    # protection rules, which silently removes the gate. See docs/PUBLISHING.md.
    environment: npm-publish
    permissions:
      contents: read
      # Required twice over: it mints the OIDC token npm exchanges for a publish
      # right, and it signs the provenance attestation.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Node.js version from .nvmrc
        id: nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      # ⚠️ Deliberately NO `registry-url` here. That input makes setup-node write
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into ~/.npmrc — and
      # with Trusted Publishing there is no NODE_AUTH_TOKEN, so the line resolves
      # to an EMPTY token. npm then considers itself authenticated, skips the
      # OIDC exchange entirely, and the registry rejects the anonymous PUT with a
      # misleading `E404 Not Found` (it masks a 403 on scoped packages).
      # registry.npmjs.org is the default registry anyway, so nothing is lost.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}
          cache: "npm"

      # Trusted Publishing needs npm >= 11.5.1. Node 24.15.0 (.nvmrc) ships
      # 11.12.1, so nothing to install — this only makes the version visible in
      # the logs, and turns a downgrade of .nvmrc into an explicit failure
      # instead of a confusing 401 at publish time.
      - name: Check npm supports Trusted Publishing
        run: |
          version=$(npm --version)
          echo "npm $version"
          required=11.5.1
          if [ "$(printf '%s\n%s\n' "$required" "$version" | sort -V | head -n1)" != "$required" ]; then
            echo "::error::Trusted Publishing requires npm >= $required, got $version. Bump .nvmrc or install npm@latest."
            exit 1
          fi

          # An auth token configured for the registry — even an EMPTY one, as
          # setup-node's `registry-url` produces without NODE_AUTH_TOKEN — makes
          # npm skip the OIDC exchange and fail with a misleading E404. Read the
          # .npmrc files directly: `npm config get` refuses to return protected
          # auth options.
          for rc in "$HOME/.npmrc" "$GITHUB_WORKSPACE/.npmrc"; do
            if [ -f "$rc" ] && grep -q '_authToken' "$rc"; then
              echo "::error::$rc configures an _authToken; it disables Trusted Publishing. Remove registry-url from setup-node."
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      # Rebuilt here rather than carried over as an artifact, so the published
      # tarball is unambiguously produced by this job — which is also what the
      # provenance attestation ends up certifying.
      - name: Build the package
        run: npm run ui-kit:build

      - name: Publish
        # No NODE_AUTH_TOKEN: npm exchanges the job's OIDC token for a
        # short-lived publish right (Trusted Publishing). `--provenance` stays
        # explicit even though OIDC implies it, so a fallback token publish
        # would still be attested.
        # `access: public` comes from the package's publishConfig — a scoped
        # package would otherwise default to `restricted` (paid plans only).
        run: npm publish --provenance
        working-directory: dist/ui-kit

      # Read from the tarball manifest rather than from `projects/ui-kit/`, so the
      # tag can only ever name the version that was actually accepted by npm.
      - name: Record the published version
        id: published
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
        working-directory: dist/ui-kit

  release:
    name: Tag & GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # Creates the tag and the release. Deliberately not granted to `publish`:
      # that job already carries the npm publishing right, and the two should not
      # be reachable from the same compromised step.
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # `npm version` + `git push --follow-tags` (docs/VERSIONING.md) may already
      # have pushed the tag; `gh release create` reuses it when it exists and
      # creates it on --target otherwise. Both ways of working stay valid.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          tag="v$VERSION"

          # Idempotent: re-running this job alone (after a transient failure)
          # must not error out on an already-published release. A duplicate
          # *version* cannot reach this point — npm rejects a republish.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::Release $tag already exists — nothing to do."
            exit 0
          fi

          # Already validated by `verify`; if it fails here the CHANGELOG changed
          # between the two jobs, and failing is the right answer.
          node scripts/changelog.section.mjs "$VERSION" > release-notes.md

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file release-notes.md
