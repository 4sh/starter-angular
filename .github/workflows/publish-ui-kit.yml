name: Publish @4sh/ui-kit to npm

# Manual trigger only: publishing is irreversible (a name+version can never be
# reused, and `npm unpublish` is limited to 72h), so it never fires on a push.
#
# Two jobs on purpose:
#   verify  — always runs, builds and shows the exact tarball contents. No
#             secret, no approval needed, so it is cheap to run as often as
#             you like.
#   publish — only when dry_run is false, and gated behind the `npm-publish`
#             environment so a human must approve before the job can even
#             read NPM_TOKEN.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (inspect the tarball without publishing)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Build & inspect tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Node.js version from .nvmrc
        id: nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build the package
        run: npm run ui-kit:build

      - name: Show what would be published
        run: npm publish --dry-run
        working-directory: dist/ui-kit

  publish:
    name: Publish to npm
    needs: verify
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    # Requires a human approval before this job starts — configure
    # *Settings → Environments → npm-publish → Required reviewers*.
    # ⚠️ Referencing an environment that does not exist yet creates it WITHOUT
    # protection rules, which silently removes the gate. See docs/PUBLISHING.md.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Node.js version from .nvmrc
        id: nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      # Rebuilt here rather than carried over as an artifact, so the published
      # tarball is unambiguously produced by this job — which is also what the
      # provenance attestation ends up certifying.
      - name: Build the package
        run: npm run ui-kit:build

      - name: Publish
        # `access: public` comes from the package's publishConfig — a scoped
        # package would otherwise default to `restricted` (paid plans only).
        run: npm publish --provenance
        working-directory: dist/ui-kit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
